<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNDOCHEM - 출고현황 Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
</head>
<body class="p-4 min-h-screen flex flex-col opacity-0 transition-opacity duration-500" id="main-body">
    <div class="print-wrapper flex-1 flex flex-col max-w-[1600px] mx-auto w-full">
        
        <div class="flex justify-between items-center mb-4 flex-nowrap">
            <div class="flex items-center gap-4 flex-nowrap">
                <i class="fas fa-truck-field text-[2.5rem] text-pink-500 no-print"></i>
                <h1 class="text-[2.5rem] font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400 tracking-widest drop-shadow-md print-title">출 고 현 황</h1>
            </div>
            
            <div class="flex items-center gap-2 bg-slate-800 px-6 py-2.5 rounded-full border border-slate-600 shadow-inner flex-nowrap print:border-black">
                <span class="text-slate-400 font-black text-lg tracking-widest print:text-black">근무일자:</span>
                <input type="date" id="log-date" class="bg-transparent border-none text-2xl font-black text-amber-300 outline-none cursor-pointer print:text-black">
                <span id="log-day" class="text-2xl font-black text-amber-300 print:text-black">요일</span>
            </div>
            
            <div class="flex gap-2 no-print shrink-0">
                <div class="bg-blue-900/30 px-4 py-2 rounded border border-blue-500/30 flex items-center gap-2 mr-2">
                    <i class="fas fa-user-shield text-blue-400"></i>
                    <span id="user-info" class="text-xs font-bold text-blue-200">Auth Checking...</span>
                </div>
                <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded border border-slate-500 font-bold transition">로그아웃</button>
                <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded border border-slate-500 font-bold transition"><i class="fas fa-print mr-2"></i>인쇄</button>
            </div>
        </div>

        <main class="log-container flex-1 flex flex-col gap-4 p-2 bg-slate-900 border-4 border-pink-500/30 rounded-xl overflow-hidden">
            <section class="flex-1 flex flex-col">
                <div class="flex justify-between items-end mb-1 px-2">
                    <h2 class="text-xl font-black text-blue-400"><i class="fas fa-truck-field mr-2"></i>1. L-CO₂ 출고현황</h2>
                    <span class="text-slate-500 text-sm font-bold">[단위: kg]</span>
                </div>
                <div class="grid grid-cols-2 gap-4 flex-1">
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700">
                        <table class="w-full text-center border-collapse">
                            <thead>
                                <tr class="bg-emerald-900/40 text-emerald-300 border-b border-slate-700">
                                    <th colspan="5" class="py-2 font-black tracking-widest">공업용 액체탄산가스</th>
                                </tr>
                                <tr class="bg-slate-700/50 text-slate-300 text-xs">
                                    <th class="w-[40px] border-r border-slate-700">No</th>
                                    <th class="border-r border-slate-700">차량번호</th>
                                    <th class="border-r border-slate-700">출고처</th>
                                    <th class="border-r border-slate-700">출하량</th>
                                    <th>출발시간</th>
                                </tr>
                            </thead>
                            <tbody id="lco2-industrial-body"></tbody>
                        </table>
                    </div>
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700 flex flex-col">
                        <table class="w-full text-center border-collapse flex-1">
                            <tbody id="lco2-medical-body"></tbody>
                        </table>
                        <div class="bg-slate-900 border-t-2 border-slate-600 p-2 grid grid-cols-3 gap-2 text-xs font-black">
                            <div class="bg-emerald-900/30 p-2 rounded border border-emerald-500/30 flex justify-between">
                                <span class="text-emerald-400">공업용 일계:</span>
                                <span id="sum-ind-day" class="text-white">0 kg</span>
                            </div>
                            <div class="bg-amber-900/30 p-2 rounded border border-amber-500/30 flex justify-between">
                                <span class="text-amber-400">식품용 일계:</span>
                                <span id="sum-med-day" class="text-white">0 kg</span>
                            </div>
                            <div class="bg-blue-900/40 p-2 rounded border border-blue-500 flex justify-between text-base">
                                <span class="text-blue-300">총 합계:</span>
                                <span id="sum-total-day" class="text-pink-400">0 kg</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="flex-1 flex flex-col">
                <div class="mb-1 px-2">
                    <h2 class="text-xl font-black text-purple-400"><i class="fas fa-cube mr-2"></i>2. D/I 출고현황</h2>
                </div>
                <div class="grid grid-cols-2 gap-4 flex-1">
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700">
                        <table class="w-full text-center border-collapse">
                            <thead>
                                <tr class="bg-slate-700/50 text-slate-300 text-xs border-b border-slate-700">
                                    <th class="w-[40px] border-r border-slate-700">No</th>
                                    <th class="border-r border-slate-700">차량번호</th>
                                    <th class="border-r border-slate-700">규격</th>
                                    <th class="border-r border-slate-700">수량</th>
                                    <th class="border-r border-slate-700">출하량</th>
                                    <th>출발시간</th>
                                </tr>
                            </thead>
                            <tbody id="di-left-body"></tbody>
                        </table>
                    </div>
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700 flex flex-col">
                        <table class="w-full text-center border-collapse flex-1">
                            <thead>
                                <tr class="bg-slate-700/50 text-slate-300 text-xs border-b border-slate-700">
                                    <th class="w-[40px] border-r border-slate-700">No</th>
                                    <th class="border-r border-slate-700">차량번호</th>
                                    <th class="border-r border-slate-700">규격</th>
                                    <th class="border-r border-slate-700">수량</th>
                                    <th class="border-r border-slate-700">출하량</th>
                                    <th>출발시간</th>
                                </tr>
                            </thead>
                            <tbody id="di-right-body"></tbody>
                        </table>
                        <div class="bg-slate-900 border-t-2 border-slate-600 p-2 flex justify-end">
                            <div class="bg-purple-900/40 px-6 py-2 rounded border border-purple-500 flex gap-4 text-lg font-black">
                                <span class="text-purple-300">D/I 일계:</span>
                                <span id="sum-di-day" class="text-white">0 kg</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
