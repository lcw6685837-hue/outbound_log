<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNDOCHEM - 출고현황 Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
</head>
<body class="p-3 min-h-screen flex flex-col opacity-0 transition-opacity duration-500" id="main-body">
    <div class="print-wrapper flex-1 flex flex-col max-w-[1600px] mx-auto w-full">
        
        <div class="flex justify-between items-center mb-2 flex-nowrap print-header">
            <div class="flex items-center gap-3 flex-nowrap">
                <i class="fas fa-truck-field text-[2.2rem] text-pink-500 no-print"></i>
                <h1 class="text-[2.2rem] font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400 tracking-widest drop-shadow-md print-title">출 고 현 황</h1>
            </div>
            
            <div class="flex items-center gap-2 bg-slate-800 px-4 py-1.5 rounded-full border border-slate-600 shadow-inner flex-nowrap print:border-black print-date-box">
                <!-- 🍒 체리의 유저 UX 개선: 좌우 날짜 이동 버튼 (인쇄 시 숨김) -->
                <div class="flex items-center gap-1.5 no-print border-r border-slate-600 pr-3 mr-1">
                    <button onclick="changeDate(-1)" class="w-7 h-7 rounded-full bg-slate-700 hover:bg-slate-600 text-amber-300 flex items-center justify-center transition active:scale-90 border border-slate-500/50 shadow" title="어제 날짜로 이동">
                        <i class="fas fa-chevron-left text-xs"></i>
                    </button>
                    <button onclick="changeDate(1)" class="w-7 h-7 rounded-full bg-slate-700 hover:bg-slate-600 text-amber-300 flex items-center justify-center transition active:scale-90 border border-slate-500/50 shadow" title="내일 날짜로 이동">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <span class="text-slate-400 font-black text-base tracking-widest print:text-black">근무일자:</span>
                <input type="date" id="log-date" class="bg-transparent border-none text-xl font-black text-amber-300 outline-none cursor-pointer print:text-black">
                <span id="log-day" class="text-xl font-black text-amber-300 print:text-black">요일</span>
            </div>
            
            <div class="flex gap-2 no-print shrink-0">
                <button onclick="toggleFullScreen()" class="bg-slate-700 hover:bg-slate-600 text-white px-3.5 py-1.5 rounded border border-slate-500 font-bold transition flex items-center gap-2 text-sm">
                    <i class="fas fa-expand"></i> 전체화면
                </button>
                <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white px-3.5 py-1.5 rounded border border-slate-500 font-bold transition flex items-center gap-2 text-sm">
                    <i class="fas fa-print"></i> 인쇄
                </button>
                <button onclick="logout()" class="bg-rose-600 hover:bg-rose-500 text-white px-3.5 py-1.5 rounded border border-rose-500 font-bold transition flex items-center gap-2 text-sm">
                    <i class="fas fa-sign-out-alt"></i> 닫기
                </button>
            </div>
        </div>

        <main class="log-container flex-1 flex flex-col gap-3 p-2 bg-slate-900 border-2 border-pink-500/30 rounded-xl overflow-hidden">
            
            <section class="flex-1 flex flex-col">
                <div class="flex justify-between items-end mb-1 px-1">
                    <h2 class="text-lg font-black text-blue-400"><i class="fas fa-truck-field mr-2"></i>1. L-CO₂ 출고현황</h2>
                    <span class="text-slate-500 text-xs font-bold">[단위: kg]</span>
                </div>
                <div class="grid grid-cols-2 gap-3 flex-1">
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700">
                        <table class="w-full text-center border-collapse">
                            <colgroup>
                                <col style="width: 6%;">
                                <col style="width: 14%;">
                                <col style="width: 42%;">
                                <col style="width: 21%;">
                                <col style="width: 17%;">
                            </colgroup>
                            <thead>
                                <tr class="bg-emerald-900/40 text-emerald-300 border-b border-slate-700">
                                    <th colspan="5" class="py-1 font-black tracking-widest text-sm">공업용 액체탄산가스</th>
                                </tr>
                                <tr class="bg-slate-700/50 text-slate-300 text-xs">
                                    <th class="border-r border-slate-700">No</th>
                                    <th class="border-r border-slate-700">차량번호</th>
                                    <th class="border-r border-slate-700">출고처</th>
                                    <th class="border-r border-slate-700">출하량</th>
                                    <th>출발시간</th>
                                </tr>
                            </thead>
                            <tbody id="lco2-industrial-body">
                            </tbody>
                        </table>
                    </div>
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700 flex flex-col">
                        <table class="w-full text-center border-collapse flex-1">
                            <colgroup>
                                <col style="width: 6%;">
                                <col style="width: 14%;">
                                <col style="width: 42%;">
                                <col style="width: 21%;">
                                <col style="width: 17%;">
                            </colgroup>
                            <tbody id="lco2-medical-body">
                            </tbody>
                        </table>
                        <div class="bg-slate-900 border-t border-slate-600 p-1.5 grid grid-cols-3 gap-2 text-xs font-black">
                            <div class="bg-emerald-900/30 p-1.5 rounded border border-emerald-500/30 flex justify-between">
                                <span class="text-emerald-400">공업용 일계:</span>
                                <span id="sum-ind-day" class="text-white">0 kg</span>
                            </div>
                            <div class="bg-amber-900/30 p-1.5 rounded border border-amber-500/30 flex justify-between">
                                <span class="text-amber-400">식품용 일계:</span>
                                <span id="sum-med-day" class="text-white">0 kg</span>
                            </div>
                            <div class="bg-blue-900/40 p-1.5 rounded border border-blue-500 flex justify-between text-sm">
                                <span class="text-blue-300">총 합계:</span>
                                <span id="sum-total-day" class="text-pink-400">0 kg</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="flex-1 flex flex-col">
                <div class="mb-1 px-1">
                    <h2 class="text-lg font-black text-purple-400"><i class="fas fa-cube mr-2"></i>2. D/I 출고현황</h2>
                </div>
                <div class="grid grid-cols-2 gap-3 flex-1">
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700">
                        <table class="w-full text-center border-collapse">
                            <colgroup>
                                <col style="width: 7%;">
                                <col style="width: 28%;">
                                <col style="width: 18%;">
                                <col style="width: 11%;">
                                <col style="width: 20%;">
                                <col style="width: 16%;">
                            </colgroup>
                            <thead>
                                <tr class="bg-slate-700/50 text-slate-300 text-xs border-b border-slate-700">
                                    <th class="border-r border-slate-700">No</th>
                                    <th class="border-r border-slate-700">차량번호</th>
                                    <th class="border-r border-slate-700">규격</th>
                                    <th class="border-r border-slate-700">수량</th>
                                    <th class="border-r border-slate-700">출하량</th>
                                    <th>출발시간</th>
                                </tr>
                            </thead>
                            <tbody id="di-left-body">
                            </tbody>
                        </table>
                    </div>
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700 flex flex-col">
                        <table class="w-full text-center border-collapse flex-1">
                            <colgroup>
                                <col style="width: 7%;">
                                <col style="width: 28%;">
                                <col style="width: 18%;">
                                <col style="width: 11%;">
                                <col style="width: 20%;">
                                <col style="width: 16%;">
                            </colgroup>
                            <thead>
                                <tr class="bg-slate-700/50 text-slate-300 text-xs border-b border-slate-700">
                                    <th class="border-r border-slate-700">No</th>
                                    <th class="border-r border-slate-700">차량번호</th>
                                    <th class="border-r border-slate-700">규격</th>
                                    <th class="border-r border-slate-700">수량</th>
                                    <th class="border-r border-slate-700">출하량</th>
                                    <th>출발시간</th>
                                </tr>
                            </thead>
                            <tbody id="di-right-body">
                            </tbody>
                        </table>
                        <div class="bg-slate-900 border-t border-slate-600 p-1.5 flex justify-end">
                            <div class="bg-purple-900/40 px-5 py-1 rounded border border-purple-500 flex gap-4 text-base font-black">
                                <span class="text-purple-300">D/I 일계:</span>
                                <span id="sum-di-day" class="text-white">0 kg</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
