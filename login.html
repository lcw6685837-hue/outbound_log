<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNDOCHEM - SYSTEM LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-animate { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="bg-[#0b1120] min-h-screen flex items-center justify-center font-sans relative">

    <div id="error-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden px-4">
        <div class="bg-[#1e293b] w-full max-w-sm rounded-2xl border-2 border-rose-500/50 p-6 shadow-[0_0_30px_rgba(244,63,94,0.2)] modal-animate">
            <div class="flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center mb-4 border border-rose-500/30">
                    <i class="fas fa-exclamation-triangle text-2xl text-rose-500"></i>
                </div>
                <h3 class="text-xl font-black text-white mb-2">접근 권한 오류</h3>
                <p id="error-message" class="text-slate-400 font-medium mb-6 leading-relaxed">정보가 일치하지 않습니다.</p>
                <button onclick="closeModal()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-3 rounded-xl transition active:scale-95">
                    확인
                </button>
            </div>
        </div>
    </div>

    <form class="w-full max-w-md p-8 bg-[#1e293b] rounded-2xl border border-slate-700 shadow-2xl" onsubmit="return false;" autocomplete="off">
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 bg-blue-600/20 rounded-full flex items-center justify-center border border-blue-500/50 shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <i class="fas fa-shield-alt text-3xl text-blue-400"></i>
            </div>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-white tracking-tighter mb-2">SUNDOCHEM</h1>
            <p class="text-slate-400 text-sm font-bold tracking-widest">스마트 팩토리 통합 관제시스템</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-slate-400 text-sm font-bold mb-2 ml-1">아이디 (이메일)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="login-email" 
                        class="w-full bg-[#f0f4ff] border-none rounded-xl py-4 pl-12 pr-4 text-slate-900 font-bold focus:ring-4 focus:ring-blue-500/20 outline-none transition" 
                        placeholder="이메일을 입력하세요" autocomplete="off">
                </div>
            </div>

            <div>
                <label class="block text-slate-400 text-sm font-bold mb-2 ml-1">비밀번호</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="login-pw" 
                        class="w-full bg-[#f0f4ff] border-none rounded-xl py-4 pl-12 pr-4 text-slate-900 font-bold focus:ring-4 focus:ring-blue-500/20 outline-none transition" 
                        placeholder="비밀번호를 입력하세요" autocomplete="new-password">
                </div>
            </div>

            <button id="btn-login" type="button" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-95 text-lg tracking-widest mt-4">
                SYSTEM LOGIN
            </button>
        </div>
    </form>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_JNWO5Ke5ZVJDnwP06QW9WsZXNZFv0bc",
            authDomain: "sundochem-dashboard.firebaseapp.com",
            databaseURL: "https://sundochem-dashboard-default-rtdb.firebaseio.com",
            projectId: "sundochem-dashboard",
            storageBucket: "sundochem-dashboard.firebasestorage.app",
            messagingSenderId: "360796635566",
            appId: "1:360796635566:web:d3bf85eb5e5e1574b5483f"
        };
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const btnLogin = document.getElementById('btn-login');
        const modal = document.getElementById('error-modal');
        const errorMsgEl = document.getElementById('error-message');

        function showError(msg) {
            errorMsgEl.innerText = msg;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        btnLogin.onclick = async () => {
            const email = document.getElementById('login-email').value;
            const pw = document.getElementById('login-pw').value;

            if(!email || !pw) {
                showError("아이디와 비밀번호를 모두 입력해주세요.");
                return;
            }

            try {
                await auth.signInWithEmailAndPassword(email, pw);
                location.replace("index.html");
            } catch (error) {
                showError("인증에 실패했습니다. 정보를 다시 확인하세요.");
                console.error(error);
            }
        };

        window.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                if(!modal.classList.contains('hidden')) closeModal();
                else btnLogin.click();
            }
        });
    </script>
</body>
</html>
